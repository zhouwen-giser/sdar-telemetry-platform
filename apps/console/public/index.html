<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>SDAR Telemetry Console</title><style>body{font-family:system-ui;margin:0;background:#f6f7f9;color:#172033}header{padding:20px;background:white;border-bottom:1px solid #ddd}main{padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;padding:16px;border:1px solid #ddd;border-radius:8px}pre{white-space:pre-wrap}</style></head><body><header><h1>SDAR 独立遥测平台</h1><p>只读分析与运维控制台</p></header><main><section class="card"><h2>Query API</h2><pre id="q">加载中</pre></section><section class="card"><h2>Admin API</h2><pre id="a">加载中</pre></section><section class="card"><h2>数据质量</h2><pre id="d">加载中</pre></section></main><script>async function j(u,o){try{return JSON.stringify(await (await fetch(u,o)).json(),null,2)}catch(e){return e.message}}Promise.all([j('/query/health'),j('/admin/health'),j('/admin/qualityIssues')]).then(([q,a,d])=>{document.querySelector('#q').textContent=q;document.querySelector('#a').textContent=a;document.querySelector('#d').textContent=d})</script></body></html>
